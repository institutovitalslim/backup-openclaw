<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>IVS Conteúdo — Entregas para validação</title>
<style>body{font-family:system-ui,sans-serif;max-width:820px;margin:40px auto;padding:0 20px;background:#f8f7f4;color:#1a1a1a}h1{border-bottom:2px solid #c9a24e;padding-bottom:10px}.file{background:#fff;padding:16px 20px;margin:10px 0;border-radius:6px;border-left:4px solid #c9a24e;box-shadow:0 1px 3px rgba(0,0,0,.05)}.file a{color:#8b6914;font-weight:600;text-decoration:none;display:block;font-size:17px}.file small{color:#666}</style>
</head><body>
<h1>🩺 IVS Conteúdo — Entregas para validação</h1>
<p>Lista das entregas de conteúdo disponíveis para revisão. Cada item abre o HTML renderizado.</p>
<div id="files"></div>
<script>
fetch('/api/list').then(r=>r.json()).then(data=>{
  const f=document.getElementById('files');
  data.forEach(x=>{
    f.innerHTML += '<div class="file"><a href="/conteudo/' + x.name + '">' + x.name + '</a><small>' + x.size + ' bytes • ' + x.mtime + '</small></div>';
  });
});
</script>
</body></html>
